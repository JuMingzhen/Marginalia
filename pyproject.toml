[project]
name = "marginalia"
description = "Marginalia — 本地 PDF 阅读与笔记桌面应用"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]
build = ["pyinstaller>=6.6", "pillow>=10.0"]

[project.gui-scripts]
marginalia = "marginalia.__main__:main"

[project.urls]
Homepage = "https://github.com/JuMingzhen/Marginalia"
Issues = "https://github.com/JuMingzhen/Marginalia/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 版本号只写在 marginalia/__init__.py 里，别处都从那儿读——
# 打包脚本、安装程序、关于对话框各存一份迟早对不上。
[tool.hatch.version]
path = "marginalia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["marginalia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 全角标点在中文注释里是正常的
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
