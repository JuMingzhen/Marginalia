[project]
name = "marginalia"
version = "0.1.0"
description = "Marginalia — 本地 PDF 阅读与笔记桌面应用"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 全角标点在中文注释里是正常的
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
